# IDTA 02003-1-2 "Generic Frame for Technical Data".
# semanticIds verified against IDTA-02003-1-2_Submodel_TechnicalData.pdf (2022-10).
# IDTA 02003 v2.0 switched to ECLASS IRDIs (0173-1#01-AHX837#002 etc.); this
# converter intentionally pins v1.2 as specified in mapping-draft.md.
submodel:
  idShort: TechnicalData
  semanticId: "https://admin-shell.io/ZVEI/TechnicalData/Submodel/1/2"

semantics:
  GeneralInformation: "https://admin-shell.io/ZVEI/TechnicalData/GeneralInformation/1/1"
  ManufacturerName: "0173-1#02-AAO677#002"
  ManufacturerProductDesignation: "0173-1#02-AAW338#001"
  TechnicalProperties: "https://admin-shell.io/ZVEI/TechnicalData/TechnicalProperties/1/1"

# B3~B6: no standard vocabulary exists (gap §3) -> self-defined namespace.
props_namespace: "https://step2aas.org/props"
props:
