  SurfaceArea: "https://step2aas.org/props/SurfaceArea/1/0"  # B4
  Centroid: "https://step2aas.org/props/Centroid/1/0"        # B5
  CentroidX: "https://step2aas.org/props/Centroid/X/1/0"     # B5
  CentroidY: "https://step2aas.org/props/Centroid/Y/1/0"     # B5
  CentroidZ: "https://step2aas.org/props/Centroid/Z/1/0"     # B5
  Material: "https://step2aas.org/props/Material/1/0"        # B6
  Mass: "https://step2aas.org/props/Mass/1/0"                # B7

fallbacks:
  organization: "unknown"   # B2 / G2
