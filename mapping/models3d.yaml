  # retaining gap-G1 placement as a provision artifact for viewers. Non-standard.
  PlacementScene: "https://step2aas.org/ext/PlacementScene/1/0"

constants:
  StatusValue: "Released"          # C6, ValueList-StatusValue
  Origin: "DesignEngineering"      # C19, ValueList-Origin
  PosModelPurpose: "DesignEngineering"  # C20 — gap G5 (no "authoritative geometry" value), provisional
  Representation: "SolidBody"      # C22, ValueList-Representation
  BoundingBoxKind: "MinEnvelope"   # C24, ValueList-BoundingBoxKind
  LengthUnit: "mm"                 # C23
  FileVersionId: "1"               # C5, policy D5 (bumped only if input hash changes)
  EmbeddedInfoPMI: "PMI"           # C21
  ObjectType:                      # C18, ValueList-ObjectType
    assembly: "Assembly"
    component: "Component"
  # MIME for .stp (C1 ⚠️): official model/step unregistered; "application/step"
  # is the common convention (spec fallback is application/octet-stream).
  StepMimeType: "application/step"          # VERIFY(C1)
  PreviewMimeType: "image/png"
  FileClassification:              # C12 — gap G4, self-defined
    ClassId: "CAD-3D"
    ClassName: "3D CAD model"
    ClassificationSystem: "step2aas-internal"
fallbacks:
  organization: "unknown"          # G2 / D7
