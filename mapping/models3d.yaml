  PosModelPurpose: "https://admin-shell.io/idta/Models3D/Model3D/Capability/PosModelPurpose/1/0"  # C20
  EmbeddedInfo: "https://admin-shell.io/idta/Models3D/Model3D/Capability/EmbeddedInfo/1/0"      # C21
  # --- [SMC] Geometry (C22~C25) ---
  Geometry: "https://admin-shell.io/idta/Models3D/Model3D/Geometry/1/0"
  Representation: "https://admin-shell.io/idta/Models3D/Model3D/Geometry/Representation/1/0"    # C22
