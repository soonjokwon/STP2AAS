  ValueId: "https://admin-shell.io/idta/Models3D/Model3D/File/FileId/ValueId/1/0"               # C2
  IsPrimary: "https://admin-shell.io/idta/Models3D/Model3D/File/FileId/IsPrimary/1/0"           # C2
  FileClassification: "https://admin-shell.io/idta/Models3D/Model3D/File/FileClassification/1/0"           # C12
  ClassId: "https://admin-shell.io/idta/Models3D/Model3D/File/FileClassification/ClassId/1/0"             # C12
  ClassName: "https://admin-shell.io/idta/Models3D/Model3D/File/FileClassification/ClassName/1/0"         # C12
  ClassificationSystem: "https://admin-shell.io/idta/Models3D/Model3D/File/FileClassification/ClassificationSystem/1/0"  # C12
  FileVersion: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/1/0"
  DigitalFile: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/DigitalFile/1/0"  # C1
  Title: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/Title/1/0"              # C3
  FileName: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/FileName/1/0"        # C4
  FileVersionId: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/FileVersionId/1/0"  # C5
  StatusValue: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/StatusValue/1/0"  # C6
  SetDate: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/SetDate/1/0"          # C7
  FileFormat: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/FileFormat/1/0"    # C8
  FormatName: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/FileFormat/FormatName/1/0"        # C8
  FormatVersion: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/FileFormat/FormatVersion/1/0"  # C8
  FormatQualifier: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/FileFormat/FormatQualifier/1/0"  # C8
  SourceApplication: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/SourceApplication/1/0"     # C9
  ApplicationName: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/SourceApplication/ApplicationName/1/0"        # C9
  ApplicationVersion: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/SourceApplication/ApplicationVersion/1/0"  # C9
  VendorOrganization: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/SourceApplication/VendorOrganization/1/0"  # C9
  ProvidingOrganization: "https://admin-shell.io/idta/Models3D/Model3D/File/FileVersion/ProvidingOrganization/1/0"  # C10
