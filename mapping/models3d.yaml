# IDTA 02026-1-0 "Provision of 3D Models" — semanticIds verified against spec PDF
# (docs/verification-log.md, mapping-draft.md §4 ✅). Element semanticIds are the
# doc §4 path tails prefixed with the Models3D base; the mapper (models3d.py)
# loads them by key so nothing is hardcoded (CLAUDE.md coding rules).
submodel:
  idShort: Models3D
  semanticId: "https://admin-shell.io/idta/Models3D/1/0"

# semanticIds for every SubmodelElement, keyed by its logical name.
semantics:
  Model3D: "https://admin-shell.io/idta/Models3D/Model3D/1/0"
  # --- [SMC] File (C1~C12) ---
  File: "https://admin-shell.io/idta/Models3D/Model3D/File/1/0"
